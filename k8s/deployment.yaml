apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: vllm-config
          configMap:
            name: vllm-config
            items:
              - key: vllm.yaml
                path: vllm.yaml
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

      # Бонус 2: загрузка весов вынесена в отдельный лёгкий rootless-образ.
      initContainers:
        - name: download-model
          image: my-vllm-downloader
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vllm-config
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: HF_TOKEN
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }

      containers:
        - name: vllm
          image: my-vllm
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/etc/vllm/vllm.yaml"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: vllm-config
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: VLLM_API_KEY
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: vllm-config
              mountPath: /etc/vllm
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/vllm
            - name: shm
              mountPath: /dev/shm
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "2"
              memory: 3Gi
            limits:
              cpu: "4"
              memory: 6Gi
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            failureThreshold: 3
